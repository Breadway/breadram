[workspace]
members = [
    "crates/breadram-core",
    "crates/breadramd",
    "crates/breadram-cli",
    "examples/cooperative-job",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Breadway"]
repository = "https://git.breadway.dev/Breadway/breadram"

[workspace.dependencies]
breadram-core = { path = "crates/breadram-core" }
# The released bread client. Only the daemon links it, and only to publish
# optional events and accept optional commands: everything it does degrades to
# a no-op when breadd is absent, so breadram never requires bread.
bread-utils = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.8.0", default-features = false, features = ["bread-client"] }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
