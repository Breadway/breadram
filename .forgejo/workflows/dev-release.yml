name: dev release

# Publishes a dev-track build on every push to main. See
# bread-ecosystem docs/release-channels.md.
on:
  push:
    branches: ['main']

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch main --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: clone bread-ecosystem (main)
        run: |
          set -euo pipefail
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-dev-release-XXXXXX)"
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          echo "ECOSYSTEM_CI_DIR=${ECOSYSTEM_CI_DIR}" >> "$GITHUB_ENV"

      - name: resolve dev dependencies to main
        run: |
          set -euo pipefail
          cd src
          bash "${ECOSYSTEM_CI_DIR}/scripts/dev-deps.sh" --root .

      - name: build
        run: |
          set -euo pipefail
          cd src
          bash ci/build.sh cargo build --release -p breadramd -p breadram-cli
          bash ci/build.sh cargo test --release --workspace

      - name: compute dev version
        run: |
          set -euo pipefail
          cd src
          LATEST_TAG="$(git ls-remote --tags --refs \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" 'v*' \
            | awk -F/ '{print $NF}' | sed 's/^v//' | (grep -v -- '-' || true) | sort -V | tail -1)"
          if [ -n "${LATEST_TAG}" ]; then
            CUR="${LATEST_TAG}"
          else
            CUR="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          fi
          IFS='.' read -r MA MI PA <<< "${CUR}"
          SHA="$(git rev-parse --short HEAD)"
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "VERSION=${MA}.${MI}.$((PA + 1))-dev.${TS}+${SHA}" >> "$GITHUB_ENV"

      - name: prepare artifacts
        run: |
          set -euo pipefail
          PKG_DIR="/srv/breadway-dl/dev/breadram/${VERSION}"
          mkdir -p "${PKG_DIR}"
          for bin in breadramd breadram; do
            cp "src/target/release/${bin}" "${PKG_DIR}/${bin}-x86_64"
            strip "${PKG_DIR}/${bin}-x86_64"
            sha256sum "${PKG_DIR}/${bin}-x86_64" | awk '{print $1}' \
              > "${PKG_DIR}/${bin}-x86_64.sha256"
          done
          cp src/packaging/breadram.service "${PKG_DIR}/"
          cp src/packaging/breadram.toml.example "${PKG_DIR}/"
          cp src/LICENSE "${PKG_DIR}/LICENSE"
          cp src/bakery.toml "${PKG_DIR}/bakery.toml"
          cp src/dev-deps.lock.txt "${PKG_DIR}/dev-deps.lock.txt"
          ln -sfn "${VERSION}" "/srv/breadway-dl/dev/breadram/latest"

      - name: regenerate dev index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set, refusing to regenerate dev index.json unsigned"
            exit 1
          fi
          TRACK=dev bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"
          rm -rf "${ECOSYSTEM_CI_DIR}"
