name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: [self-hosted]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: build
        run: |
          set -euo pipefail
          if [ ! -f src/ci/build.sh ]; then
            echo "::error::ci/build.sh is missing, bakery release builds must go through the shared CI wrapper"
            exit 1
          fi
          cd src
          bash ci/build.sh cargo build --release --locked -p breadramd -p breadram-cli
          bash ci/build.sh cargo test --release --locked --workspace

      - name: prepare artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/breadram/${VERSION}"
          mkdir -p "${PKG_DIR}"
          for bin in breadramd breadram; do
            cp "src/target/release/${bin}" "${PKG_DIR}/${bin}-x86_64"
            strip "${PKG_DIR}/${bin}-x86_64"
            sha256sum "${PKG_DIR}/${bin}-x86_64" | awk '{print $1}' \
              > "${PKG_DIR}/${bin}-x86_64.sha256"
          done
          cp src/packaging/breadram.service "${PKG_DIR}/"
          cp src/packaging/breadram.toml.example "${PKG_DIR}/"
          cp src/LICENSE "${PKG_DIR}/LICENSE"
          cp src/bakery.toml "${PKG_DIR}/bakery.toml"
          ln -sfn "${VERSION}" "/srv/breadway-dl/breadram/latest"

      - name: regenerate index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set, refusing to regenerate index.json unsigned"
            exit 1
          fi
          rm -rf /tmp/bread-ecosystem-ci
          git clone https://git.breadway.dev/Breadway/bread-ecosystem.git /tmp/bread-ecosystem-ci
          bash /tmp/bread-ecosystem-ci/scripts/gen-index.sh

      - name: upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/breadram/${VERSION}"
          gh release create "${GITHUB_REF_NAME}" --repo Breadway/breadram \
            --title "breadram v${VERSION}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" --repo Breadway/breadram \
            "${PKG_DIR}/breadramd-x86_64" \
            "${PKG_DIR}/breadram-x86_64" \
            "${PKG_DIR}/breadramd-x86_64.sha256" \
            "${PKG_DIR}/breadram-x86_64.sha256" \
            "${PKG_DIR}/LICENSE" \
            --clobber
